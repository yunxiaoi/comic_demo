spring:
  datasource:
    url: jdbc:mysql://localhost:3306/comic_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: 651001
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.comic.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  secret: yourSecretKeyForJWTGenerationShouldBeLongEnough
  expiration: 86400000

logging:
  level:
    root: DEBUG
    org.springframework: DEBUG

file:
  upload-path: "F:/bishe/uploads/"